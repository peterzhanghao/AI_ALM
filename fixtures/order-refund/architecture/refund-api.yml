openapi: 3.0.3
info:
  title: 退款接口
  version: 1.0.0
  x-alm-id: IF-PAY-REFUND-API
  x-alm-owner: team-payments
  x-alm-status: proposed
  x-alm-links:
    - type: constrained_by
      target: ADR-PAY-003
paths:
  /orders/{orderId}/refunds:
    post:
      operationId: createRefund
      summary: 为订单创建部分退款
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, idempotencyKey]
              properties:
                amount:
                  type: number
                  minimum: 0.01
                idempotencyKey:
                  type: string
      responses:
        '201':
          description: 退款单已创建

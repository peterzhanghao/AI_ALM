<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>需求 · 概念原型 v2</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10; --surface: #14171c; --surface-hover: #171b21;
    --line: #232830; --line-strong: #2e343d;
    --text: #f2f4f7; --text-2: #9aa3ae; --text-3: #6b7480;
    --blue: #6ea0ff; --green: #35c47a; --amber: #e7b04b;
    --radius: 14px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; font-size: 14px; }
  button { font-family: inherit; cursor: pointer; }
  .shell { max-width: 1060px; margin: 0 auto; padding: 48px 40px 96px; }
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
  h1 { margin: 0; font-size: 30px; line-height: 1.15; letter-spacing: -0.02em; font-weight: 600; }
  .sub { margin: 8px 0 0; color: var(--text-2); font-size: 13px; }
  .head-actions { display: flex; align-items: center; gap: 8px; }
  .btn { border: 1px solid var(--line-strong); background: transparent; color: var(--text); border-radius: 10px; padding: 8px 14px; font-size: 13px; transition: background 150ms ease-out, border-color 150ms ease-out; }
  .btn:hover { background: #1b1f26; }
  .btn.primary { background: #f2f4f7; border-color: transparent; color: #0b0d10; font-weight: 600; }
  .btn.primary:hover { background: #fff; }
  .btn.sm { padding: 6px 12px; font-size: 12px; border-radius: 9px; }
  .btn.ghost { border-color: transparent; color: var(--text-2); }
  .btn.ghost:hover { color: var(--text); background: #15181d; }
  .icon-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--text-2); font-size: 18px; line-height: 1; }
  .icon-btn:hover { background: #15181d; color: var(--text); }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 36px 0 20px; flex-wrap: wrap; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; background: #101318; border: 1px solid var(--line); border-radius: 11px; }
  .seg button { border: 0; background: transparent; color: var(--text-2); padding: 6px 12px; border-radius: 8px; font-size: 12.5px; transition: color 150ms, background 150ms; }
  .seg button:hover { color: var(--text); }
  .seg button.active { background: #1d222a; color: var(--text); }
  .seg span { color: var(--text-3); margin-left: 6px; font-variant-numeric: tabular-nums; }
  .search { display: flex; align-items: center; gap: 8px; min-width: 240px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 10px; background: #101318; }
  .search svg { color: var(--text-3); flex: none; }
  .search input { border: 0; outline: 0; background: transparent; color: var(--text); font-size: 13px; width: 100%; }
  .search input::placeholder { color: var(--text-3); }
  .list { display: grid; gap: 10px; }
  .card { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 20px 22px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); transition: background 160ms, border-color 160ms; cursor: pointer; outline: none; }
  .card:hover, .card:focus-visible { background: var(--surface-hover); border-color: var(--line-strong); }
  .card:focus-visible { box-shadow: 0 0 0 2px #2f6fdd66; }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; padding: 3px 9px; border-radius: 999px; }
  .pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .pill.proposed { color: #b9c0c9; background: #1c2027; }
  .pill.accepted { color: #9dc0ff; background: #16233a; }
  .pill.doing { color: #f0cf8d; background: #2a2416; }
  .pill.done { color: #8fe0b4; background: #14261d; }
  .id { color: var(--text-3); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .rev { color: var(--text-3); font-size: 11px; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; font-variant-numeric: tabular-nums; }
  .card h2 { margin: 0; font-size: 17px; line-height: 1.45; font-weight: 600; letter-spacing: -0.01em; }
  .meta { margin: 8px 0 0; color: var(--text-2); font-size: 12.5px; }
  .meta .dot { margin: 0 7px; color: var(--text-3); }
  .src { color: var(--text-3); }
  .card-cta { background: transparent; border-color: var(--line-strong); color: var(--text-2); transition: background 160ms, color 160ms, border-color 160ms; }
  .card:hover .card-cta, .card:focus-within .card-cta { background: #f2f4f7; border-color: transparent; color: #0b0d10; }
  .empty { border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 56px 24px; text-align: center; color: var(--text-2); }
  .empty strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }
  .scrim { position: fixed; inset: 0; background: rgba(4,6,9,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; transition: opacity 200ms ease-out; }
  .scrim.show { opacity: 1; }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: 500px; max-width: 94vw; background: #101318; border-left: 1px solid var(--line); transform: translateX(24px); opacity: 0; transition: transform 220ms cubic-bezier(.2,.7,.2,1), opacity 200ms ease-out; overflow-y: auto; }
  .drawer.show { transform: translateX(0); opacity: 1; }
  .drawer-inner { padding: 36px 32px 48px; }
  .drawer-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .drawer h2 { margin: 14px 0 0; font-size: 22px; line-height: 1.35; letter-spacing: -0.01em; }
  .drawer .meta { margin-top: 10px; }
  .section-title { margin: 28px 0 10px; font-size: 11.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; display: flex; align-items: center; justify-content: space-between; }
  .section-title .link { text-transform: none; letter-spacing: 0; }
  .brief { margin: 0; color: var(--text-2); font-size: 13.5px; line-height: 1.75; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .chip { font-size: 11.5px; color: var(--text-2); border: 1px solid var(--line); background: #14171c; border-radius: 999px; padding: 3px 9px; }
  .attach { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--text-2); font-size: 12.5px; }
  .attach svg { flex: none; color: var(--text-3); }
  .attach .size { margin-left: auto; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .check { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid #1b1f25; font-size: 13.5px; }
  .check:last-child { border-bottom: 0; }
  .check svg { color: var(--green); flex: none; margin-top: 1px; }
  .accept-state { margin-bottom: 4px; font-size: 12.5px; color: var(--amber); }
  .rel { display: flex; gap: 10px; padding: 8px 0; font-size: 13px; color: var(--text-2); border-bottom: 1px solid #1b1f25; }
  .rel:last-child { border-bottom: 0; }
  .rel b { color: var(--text); font-weight: 500; width: 52px; flex: none; }
  .timeline { margin: 0; padding: 0; list-style: none; }
  .timeline li { position: relative; padding: 0 0 16px 18px; border-left: 1px solid var(--line); font-size: 12.5px; color: var(--text-2); }
  .timeline li:last-child { border-left-color: transparent; padding-bottom: 0; }
  .timeline li::before { content: ""; position: absolute; left: -4px; top: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
  .timeline li:first-child::before { background: var(--blue); }
  .timeline b { color: var(--text); font-weight: 600; }
  .drawer-actions { display: flex; gap: 10px; margin-top: 28px; }
  .drawer-actions .btn { flex: 1; text-align: center; }
  details.tech { margin-top: 30px; border-top: 1px solid var(--line); padding-top: 16px; }
  details.tech summary { list-style: none; cursor: pointer; color: var(--text-2); font-size: 12.5px; display: flex; align-items: center; gap: 8px; }
  details.tech summary::-webkit-details-marker { display: none; }
  details.tech summary::before { content: "▸"; transition: transform 150ms; }
  details.tech[open] summary::before { transform: rotate(90deg); }
  .tech-body { margin-top: 12px; color: var(--text-2); font-size: 12.5px; line-height: 1.9; }
  .tech-body code { color: var(--text); background: #171b21; border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; font-size: 11.5px; }
  .link { border: 0; background: transparent; color: var(--text-2); padding: 0; font-size: 12px; }
  .link:hover { color: var(--text); }
  .modal-scrim { position: fixed; inset: 0; background: rgba(4,6,9,.6); backdrop-filter: blur(8px); display: grid; place-items: center; }
  .modal { width: 600px; max-width: 94vw; background: #12151a; border: 1px solid var(--line-strong); border-radius: 18px; padding: 28px; box-shadow: 0 24px 80px rgba(0,0,0,.5); }
  .modal h3 { margin: 0; font-size: 19px; letter-spacing: -0.01em; }
  .modal p.lead { margin: 8px 0 18px; color: var(--text-2); font-size: 13px; }
  .context { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 12px; color: var(--text-2); margin-bottom: 18px; }
  .context b { color: var(--text); font-weight: 500; display: block; font-size: 12.5px; margin-top: 2px; }
  .task-row { display: flex; gap: 12px; padding: 13px 0; border-top: 1px solid #1b1f25; }
  .task-row:last-of-type { border-bottom: 1px solid #1b1f25; }
  .task-index { width: 22px; color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 2px; }
  .task-row strong { display: block; font-size: 13.5px; font-weight: 600; }
  .task-row span { display: block; margin-top: 3px; color: var(--text-2); font-size: 12.5px; }
  .modal-note { margin: 16px 0 0; color: var(--text-3); font-size: 12px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .toggle { display: flex; align-items: center; gap: 8px; margin-top: 16px; color: var(--text-2); font-size: 12.5px; }
  .toggle input { accent-color: #4d8dff; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #1b2028; border: 1px solid var(--line-strong); color: var(--text); font-size: 12.5px; padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity 180ms; pointer-events: none; }
  .toast.show { opacity: 1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="shell">
  <header class="head">
    <div>
      <h1>需求</h1>
      <p class="sub" id="summary">2 条需求 · 验收齐全 · 1 条待评审</p>
    </div>
    <div class="head-actions">
      <button class="btn ghost" id="newBtn">＋ 新建</button>
      <button class="icon-btn" aria-label="更多">⋯</button>
    </div>
  </header>
  <div class="toolbar">
    <div class="seg" id="seg">
      <button class="active" data-filter="all">全部<span id="countAll">2</span></button>
      <button data-filter="proposed">待评审<span id="countProposed">1</span></button>
      <button data-filter="accepted">已采纳<span id="countAccepted">1</span></button>
      <button data-filter="doing">开发中<span>0</span></button>
      <button data-filter="done">已验收<span>0</span></button>
    </div>
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.2" stroke="currentColor" stroke-width="1.3"/><path d="M10.4 10.4 13.5 13.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="搜索需求" aria-label="搜索需求">
    </label>
  </div>
  <main class="list" id="list"></main>
  <div class="empty" id="empty" hidden><strong>这里还没有需求</strong>新建一条，或从聊天记录、截图导入。</div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="需求详情">
  <div class="drawer-inner">
    <div class="drawer-top">
      <div class="card-head" style="margin:0"><span class="pill" id="dPill"></span><span class="rev" id="dRev"></span></div>
      <div style="display:flex;gap:4px">
        <button class="btn sm ghost" id="dEdit">编辑</button>
        <button class="icon-btn" id="closeDrawer" aria-label="关闭">×</button>
      </div>
    </div>
    <h2 id="dTitle"></h2>
    <p class="meta" id="dMeta"></p>
    <div class="section-title">背景与来源 <button class="link" id="openBrief">查看简报</button></div>
    <p class="brief" id="dBrief"></p>
    <div class="chips" id="dChips"></div>
    <div id="dAttachments"></div>
    <div class="section-title">验收</div>
    <div class="accept-state" id="dAcceptState"></div>
    <div id="dChecks"></div>
    <div class="section-title">关系 <button class="link" id="openTrace">查看追溯</button></div>
    <div id="dRelations"></div>
    <div class="section-title">历史</div>
    <ol class="timeline" id="dHistory"></ol>
    <div class="drawer-actions">
      <button class="btn" id="runAccept">运行验收</button>
      <button class="btn primary" id="dStart">开始开发</button>
    </div>
    <details class="tech"><summary>技术详情</summary><div class="tech-body" id="dTech"></div></details>
  </div>
</aside>

<div class="modal-scrim" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="生成开发任务">
    <h3>开始开发</h3>
    <p class="lead" id="modalLead"></p>
    <div class="context">
      <div>变更 <b>CHG-PAY-005</b></div>
      <div>分支 <b>alm/chg-pay-005</b></div>
      <div>基线 <b>c678e16（HEAD）</b></div>
      <div>状态 <b id="ctxStatus">已采纳 → 开发中</b></div>
    </div>
    <div id="modalTasks"></div>
    <label class="toggle"><input type="checkbox" id="syncBox"> 同时创建看板 Issue（GitHub / Gitea）</label>
    <p class="modal-note">确认后写入 changes/&lt;CHG&gt;/，生成 3 张任务卡；建 Issue 需要本机凭据。</p>
    <div class="modal-actions">
      <button class="btn" id="modalCancel">取消</button>
      <button class="btn primary" id="modalConfirm">确认并生成</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  const REQS = [
    {
      id: 'REQ-PAY-004',
      title: '同一幂等键的重复退款请求返回同一退款单',
      status: 'accepted', statusText: '已采纳', revision: 2,
      team: '支付团队', priority: 'P1',
      brief: '退款金额不得超过订单可退余额；同一订单 + 同一幂等键只产生一张退款单，重复请求返回首次结果。',
      sources: ['聊天', '会议'], attachments: [{ name: 'chat-2026-10-29.md', size: '1.2 KB' }],
      checks: ['同键重放返回同一 refundId，且不新增退款记录', '并发同键请求只产生一条退款单'],
      acceptState: '已覆盖 2/2 · 待验证',
      relations: [['上级', ['REQ-PAY-001 支持订单部分退款']], ['验收', ['TEST-PAY-004', 'TEST-PAY-005']], ['依赖', []]],
      history: [['v2', '2026-10-30', 'CHG-PAY-004', '补充并发验收'], ['v1', '2026-10-28', 'CHG-PAY-002', '初始版本']],
      tech: { file: 'requirements/refund-idempotent.sdoc:7', manifest: 'manifest.json · sha256 c485187b…', rules: 'COV-001 / REL-002 / ATT-001 / TASK-001 通过' },
      tasks: [['需求与验收资产', '补齐验收与关系（requirements/ · tests/）'], ['实现（退款模块）', '幂等键、去重表与事务边界'], ['门禁、差异与证据', 'check / diff / impact，落 alm.evidence/v1']]
    },
    {
      id: 'REQ-PAY-001',
      title: '支持订单部分退款',
      status: 'proposed', statusText: '待评审', revision: 1,
      team: '支付团队', priority: 'P1',
      brief: '订单支持按金额部分退款，退款金额与订单状态保持一致。',
      sources: ['会议'], attachments: [],
      checks: ['部分退款金额与订单状态一致'],
      acceptState: '已覆盖 1/1 · 待验证',
      relations: [['子需求', ['REQ-PAY-004 退款幂等']], ['验收', ['TEST-PAY-001']], ['依赖', []]],
      history: [['v1', '2026-10-23', 'CHG-PAY-001', '初始版本']],
      tech: { file: 'requirements/refund.sdoc:7', manifest: '无附件', rules: 'COV-001 / REL-002 通过' },
      tasks: [['需求与验收资产', '补齐验收与关系（requirements/ · tests/）'], ['实现（退款模块）', '退款金额与订单状态一次事务内更新'], ['门禁、差异与证据', 'check / diff / impact，落 alm.evidence/v1']]
    }
  ]

  const el = (id) => document.getElementById(id)
  const checkSvg = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.2 8.4 6.3 11.5 12.8 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  const fileSvg = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 2.5h6l3 3v8a1 1 0 0 1-1 1h-8a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.2"/><path d="M5.5 7h5M5.5 10h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>'

  let filter = 'all'
  let keyword = ''

  function card(req) {
    const sources = req.sources.length ? `<span class="dot">·</span><span class="src">${req.sources.join(' / ')}</span>` : ''
    const attach = req.attachments.length ? `<span class="dot">·</span><span class="src">${req.attachments.length} 个附件</span>` : ''
    return `<article class="card" data-id="${req.id}" tabindex="0" role="button" aria-label="查看 ${req.title}">
      <div>
        <div class="card-head"><span class="pill ${req.status}">${req.statusText}</span><span class="id">${req.id}</span><span class="rev">v${req.revision}</span></div>
        <h2>${req.title}</h2>
        <p class="meta">${req.team}<span class="dot">·</span>验收 ${req.checks.length}/${req.checks.length}${sources}${attach}</p>
      </div>
      <button class="btn bg sm card-cta" data-start="${req.id}">开始开发</button>
    </article>`
  }

  function render() {
    const visible = REQS.filter((req) => filter === 'all' || req.status === filter)
      .filter((req) => req.title.includes(keyword) || req.id.includes(keyword.toUpperCase()))
    el('list').innerHTML = visible.map(card).join('')
    el('empty').hidden = visible.length > 0
    el('summary').textContent = visible.length
      ? `${REQS.length} 条需求 · 验收齐全 · ${REQS.filter((r) => r.status === 'proposed').length} 条待评审`
      : '没有匹配的需求'
    for (const btn of el('seg').querySelectorAll('button')) btn.classList.toggle('active', btn.dataset.filter === filter)
  }

  function openDrawer(id) {
    const req = REQS.find((r) => r.id === id)
    if (!req) return
    el('dPill').className = `pill ${req.status}`
    el('dPill').textContent = req.statusText
    el('dRev').textContent = `v${req.revision}`
    el('dTitle').textContent = req.title
    el('dMeta').textContent = `${req.team} · ${req.priority} · ${req.id}`
    el('dBrief').textContent = req.brief
    el('dChips').innerHTML = req.sources.map((s) => `<span class="chip">来源 · ${s}</span>`).join('')
    el('dAttachments').innerHTML = req.attachments.map((a) => `<div class="attach">${fileSvg}<span>${a.name}</span><span class="size">${a.size}</span></div>`).join('')
    el('dAcceptState').textContent = req.acceptState
    el('dChecks').innerHTML = req.checks.map((c) => `<div class="check">${checkSvg}<span>${c}</span></div>`).join('')
    el('dRelations').innerHTML = req.relations.map(([label, items]) => `<div class="rel"><b>${label}</b><span>${items.length ? items.join('、') : '无'}</span></div>`).join('')
    el('dHistory').innerHTML = req.history.map(([v, date, change, note]) => `<li><b>${v}</b> ${date} · ${change} · ${note}</li>`).join('')
    el('dTech').innerHTML = `<div><code>${req.id}</code> · <code>${req.tech.file}</code></div><div>附件：${req.tech.manifest}</div><div>门禁：${req.tech.rules}</div>`
    el('dStart').dataset.start = req.id
    el('runAccept').dataset.id = req.id
    el('scrim').hidden = false
    el('drawer').hidden = false
    requestAnimationFrame(() => { el('scrim').classList.add('show'); el('drawer').classList.add('show') })
    el('drawer').scrollTop = 0
  }

  function closeDrawer() {
    el('scrim').classList.remove('show')
    el('drawer').classList.remove('show')
    setTimeout(() => { el('scrim').hidden = true; el('drawer').hidden = true }, 200)
  }

  function openModal(id) {
    const req = REQS.find((r) => r.id === id)
    if (!req) return
    el('modalLead').textContent = `为「${req.title}」生成 ${req.tasks.length} 张任务卡，并启动变更。`
    el('ctxStatus').textContent = `${req.statusText} → 开发中`
    el('modalTasks').innerHTML = req.tasks.map(([name, hint], i) => `<div class="task-row"><div class="task-index">0${i + 1}</div><div><strong>${name}</strong><span>${hint}</span></div></div>`).join('')
    el('modal').hidden = false
  }

  function closeModal() { el('modal').hidden = true }

  let toastTimer
  function toast(text) {
    el('toast').textContent = text
    el('toast').classList.add('show')
    clearTimeout(toastTimer)
    toastTimer = setTimeout(() => el('toast').classList.remove('show'), 1600)
  }

  document.addEventListener('click', (event) => {
    const start = event.target.closest('[data-start]')
    if (start) { event.stopPropagation(); openModal(start.dataset.start); return }
    const cardEl = event.target.closest('.card')
    if (cardEl) openDrawer(cardEl.dataset.id)
  })

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') { closeModal(); closeDrawer() }
    if (event.key === 'Enter' && document.activeElement?.classList?.contains('card')) openDrawer(document.activeElement.dataset.id)
  })

  el('seg').addEventListener('click', (event) => {
    const btn = event.target.closest('button[data-filter]')
    if (!btn) return
    filter = btn.dataset.filter
    render()
  })
  el('search').addEventListener('input', (event) => { keyword = event.target.value.trim(); render() })
  el('scrim').addEventListener('click', closeDrawer)
  el('closeDrawer').addEventListener('click', closeDrawer)
  el('dStart').addEventListener('click', () => openModal(el('dStart').dataset.start))
  el('runAccept').addEventListener('click', () => toast('验收命令已排队：alm ci run --requirement ' + el('runAccept').dataset.id))
  el('openBrief').addEventListener('click', () => toast('打开 brief（原型占位）'))
  el('openTrace').addEventListener('click', () => toast('打开追溯视图（原型占位）'))
  el('dEdit').addEventListener('click', () => toast('进入编辑（仅工作区内可写）'))
  el('modalCancel').addEventListener('click', closeModal)
  el('modalConfirm').addEventListener('click', () => { closeModal(); toast('已生成变更与 3 张任务卡（原型）') })
  el('newBtn').addEventListener('click', () => toast('新建：一句话 / 粘贴截图 / 导入聊天记录'))
  render()
</script>
</body>
</html>

name: Autonomous delivery pilot

on:
  pull_request:
    branches: [codex/autonomous-pilot-target]

permissions:
  contents: read

jobs:
  pilot-contract:
    name: pilot-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/delivery/REQ-PILOT-001/pagination.test.mjs

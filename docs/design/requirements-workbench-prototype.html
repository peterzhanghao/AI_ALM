<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>需求 · 概念原型</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10;
    --surface: #14171c;
    --surface-hover: #171b21;
    --line: #232830;
    --line-strong: #2e343d;
    --text: #f2f4f7;
    --text-2: #9aa3ae;
    --text-3: #6b7480;
    --accent: #f2f4f7;
    --blue: #4d8dff;
    --green: #35c47a;
    --amber: #e7b04b;
    --radius: 14px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
  }
  button { font-family: inherit; cursor: pointer; }
  .shell { max-width: 1040px; margin: 0 auto; padding: 48px 40px 96px; }

  /* header */
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
  h1 { margin: 0; font-size: 30px; line-height: 1.15; letter-spacing: -0.02em; font-weight: 600; }
  .sub { margin: 8px 0 0; color: var(--text-2); font-size: 13px; }
  .head-actions { display: flex; align-items: center; gap: 8px; }
  .btn {
    border: 1px solid var(--line-strong);
    background: transparent;
    color: var(--text);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    transition: background 150ms ease-out, border-color 150ms ease-out, transform 150ms ease-out;
  }
  .btn:hover { background: #1b1f26; }
  .btn.primary {
    background: var(--accent);
    border-color: transparent;
    color: #0b0d10;
    font-weight: 600;
  }
  .btn.primary:hover { background: #ffffff; }
  .btn.sm { padding: 6px 12px; font-size: 12px; border-radius: 9px; }
  .btn.ghost { border-color: transparent; color: var(--text-2); }
  .btn.ghost:hover { color: var(--text); background: #15181d; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 10px;
    border: 1px solid transparent; background: transparent;
    color: var(--text-2); font-size: 18px; line-height: 1;
  }
  .icon-btn:hover { background: #15181d; color: var(--text); }

  /* toolbar */
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 36px 0 20px; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; background: #101318; border: 1px solid var(--line); border-radius: 11px; }
  .seg button {
    border: 0; background: transparent; color: var(--text-2);
    padding: 6px 12px; border-radius: 8px; font-size: 12.5px;
    transition: color 150ms ease-out, background 150ms ease-out;
  }
  .seg button:hover { color: var(--text); }
  .seg button.active { background: #1d222a; color: var(--text); }
  .seg span { color: var(--text-3); margin-left: 6px; font-variant-numeric: tabular-nums; }
  .search {
    display: flex; align-items: center; gap: 8px;
    min-width: 240px; padding: 7px 12px;
    border: 1px solid var(--line); border-radius: 10px; background: #101318;
  }
  .search svg { color: var(--text-3); flex: none; }
  .search input {
    border: 0; outline: 0; background: transparent; color: var(--text);
    font-size: 13px; width: 100%;
  }
  .search input::placeholder { color: var(--text-3); }

  /* list */
  .list { display: grid; gap: 10px; }
  .card {
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    padding: 20px 22px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    transition: background 160ms ease-out, border-color 160ms ease-out;
    cursor: pointer;
    outline: none;
  }
  .card:hover, .card:focus-visible { background: var(--surface-hover); border-color: var(--line-strong); }
  .card:focus-visible { box-shadow: 0 0 0 2px #2f6fdd66; }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid transparent;
  }
  .pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .pill.todo { color: #b9c0c9; background: #1c2027; }
  .pill.doing { color: #9dc0ff; background: #16233a; }
  .pill.done { color: #8fe0b4; background: #14261d; }
  .id { color: var(--text-3); font-size: 11.5px; font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
  .card h2 { margin: 0; font-size: 17px; line-height: 1.45; font-weight: 600; letter-spacing: -0.01em; }
  .meta { margin: 8px 0 0; color: var(--text-2); font-size: 12.5px; }
  .meta .dot { margin: 0 7px; color: var(--text-3); }
  .card-cta {
    background: transparent; border-color: var(--line-strong); color: var(--text-2);
    transition: background 160ms ease-out, color 160ms ease-out, border-color 160ms ease-out;
  }
  .card:hover .card-cta, .card:focus-within .card-cta {
    background: var(--accent); border-color: transparent; color: #0b0d10;
  }

  /* empty state */
  .empty {
    border: 1px dashed var(--line-strong); border-radius: var(--radius);
    padding: 56px 24px; text-align: center; color: var(--text-2);
  }
  .empty strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }

  /* footer */
  .foot { margin-top: 28px; display: flex; align-items: center; justify-content: space-between; color: var(--text-3); font-size: 12px; }
  .link { border: 0; background: transparent; color: var(--text-2); padding: 0; font-size: 12px; }
  .link:hover { color: var(--text); }

  /* drawer */
  .scrim {
    position: fixed; inset: 0; background: rgba(4, 6, 9, 0.55);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity: 0; transition: opacity 200ms ease-out;
  }
  .scrim.show { opacity: 1; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: 480px; max-width: 92vw;
    background: #101318; border-left: 1px solid var(--line);
    transform: translateX(24px); opacity: 0;
    transition: transform 220ms cubic-bezier(.2,.7,.2,1), opacity 200ms ease-out;
    overflow-y: auto;
  }
  .drawer.show { transform: translateX(0); opacity: 1; }
  .drawer-inner { padding: 40px 32px 40px; }
  .drawer-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .drawer h2 { margin: 14px 0 0; font-size: 22px; line-height: 1.35; letter-spacing: -0.01em; }
  .drawer .desc { color: var(--text-2); font-size: 13.5px; line-height: 1.75; margin: 14px 0 0; }
  .section-title { margin: 32px 0 12px; font-size: 12px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; }
  .check { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid #1b1f25; font-size: 13.5px; color: var(--text); }
  .check:last-child { border-bottom: 0; }
  .check svg { color: var(--green); flex: none; margin-top: 1px; }
  .drawer-actions { display: flex; gap: 10px; margin-top: 28px; }
  .drawer-actions .btn { flex: 1; text-align: center; padding: 11px 14px; }
  details.tech { margin-top: 34px; border-top: 1px solid var(--line); padding-top: 18px; }
  details.tech summary {
    list-style: none; cursor: pointer; color: var(--text-2); font-size: 12.5px;
    display: flex; align-items: center; gap: 8px;
  }
  details.tech summary::-webkit-details-marker { display: none; }
  details.tech summary::before { content: "▸"; transition: transform 150ms ease-out; }
  details.tech[open] summary::before { transform: rotate(90deg); }
  .tech-body { margin-top: 14px; color: var(--text-2); font-size: 12.5px; line-height: 1.9; }
  .tech-body code { color: var(--text); background: #171b21; border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; font-size: 11.5px; }

  /* modal */
  .modal-scrim { position: fixed; inset: 0; background: rgba(4,6,9,.6); backdrop-filter: blur(8px); display: grid; place-items: center; }
  .modal {
    width: 560px; max-width: 92vw; background: #12151a; border: 1px solid var(--line-strong);
    border-radius: 18px; padding: 28px; box-shadow: 0 24px 80px rgba(0,0,0,.5);
  }
  .modal h3 { margin: 0; font-size: 19px; letter-spacing: -0.01em; }
  .modal p.lead { margin: 8px 0 20px; color: var(--text-2); font-size: 13px; }
  .task-row { display: flex; gap: 12px; padding: 14px 0; border-top: 1px solid #1b1f25; }
  .task-row:last-of-type { border-bottom: 1px solid #1b1f25; }
  .task-index { width: 22px; color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 2px; }
  .task-row strong { display: block; font-size: 13.5px; font-weight: 600; }
  .task-row span { display: block; margin-top: 3px; color: var(--text-2); font-size: 12.5px; }
  .modal-note { margin: 16px 0 22px; color: var(--text-3); font-size: 12px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="shell">
  <header class="head">
    <div>
      <h1>需求</h1>
      <p class="sub" id="summary">2 条需求，验收齐全</p>
    </div>
    <div class="head-actions">
      <button class="btn ghost" id="newBtn">＋ 新建</button>
      <button class="icon-btn" aria-label="更多">⋯</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="seg" id="seg">
      <button class="active" data-filter="all">全部<span id="countAll">2</span></button>
      <button data-filter="todo">待开发<span id="countTodo">2</span></button>
      <button data-filter="doing">开发中<span>0</span></button>
      <button data-filter="done">已验收<span>0</span></button>
    </div>
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.2" stroke="currentColor" stroke-width="1.3"/><path d="M10.4 10.4 13.5 13.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="搜索需求" aria-label="搜索需求">
    </label>
  </div>

  <main class="list" id="list"></main>
  <div class="empty" id="empty" hidden>
    <strong>这里还没有需求</strong>
    新建一条，或者让 AI 按业务描述起草。
  </div>


</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="需求详情">
  <div class="drawer-inner">
    <div class="drawer-top">
      <span class="pill todo" id="dPill">待开发</span>
      <button class="icon-btn" id="closeDrawer" aria-label="关闭">×</button>
    </div>
    <h2 id="dTitle"></h2>
    <p class="desc" id="dDesc"></p>

    <div class="section-title">验收</div>
    <div id="dChecks"></div>

    <div class="drawer-actions">
      <button class="btn" id="aiBtn">让 AI 补充验收</button>
      <button class="btn primary" id="dStart">开始开发</button>
    </div>

    <details class="tech">
      <summary>技术详情</summary>
      <div class="tech-body" id="dTech"></div>
    </details>
  </div>
</aside>

<div class="modal-scrim" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="生成开发任务">
    <h3>生成开发任务</h3>
    <p class="lead" id="modalLead">将为「同一幂等键的重复退款请求返回同一退款单」生成 3 张任务卡。</p>
    <div id="modalTasks"></div>
    <p class="modal-note">这是预览：确认后才会写入变更目录并生成看板卡，可随时取消。</p>
    <div class="modal-actions">
      <button class="btn" id="modalCancel">取消</button>
      <button class="btn primary" id="modalConfirm">生成预览</button>
    </div>
  </div>
</div>

<script>
  const REQS = [
    {
      id: 'REQ-PAY-004',
      title: '同一幂等键的重复退款请求返回同一退款单',
      team: '支付团队',
      state: 'todo',
      stateText: '待开发',
      desc: '退款金额不得超过订单可退余额；重复提交必须返回同一张退款单，不新增记录。',
      checks: ['同键重放返回同一 refundId，且不新增退款记录', '并发同键请求只产生一条退款单'],
      tech: {
        file: 'requirements/refund-idempotent.sdoc:7',
        rels: ['allocated_to → 退款模块', 'constrained_by → ADR-PAY-003', 'verified_by → TEST-PAY-004 / TEST-PAY-005'],
        rule: 'COV-001 / REL-002 / TASK-001 通过'
      },
      tasks: [
        ['需求与验收资产', '补齐验收与关系（requirements/ · tests/）'],
        ['实现（退款模块）', '幂等键、去重表与事务边界'],
        ['门禁、差异与证据', 'check / diff / impact，落 alm.evidence/v1']
      ]
    },
    {
      id: 'REQ-PAY-001',
      title: '支持订单部分退款',
      team: '支付团队',
      state: 'todo',
      stateText: '待开发',
      desc: '订单支持按金额部分退款，退款金额与订单状态保持一致。',
      checks: ['部分退款金额与订单状态一致'],
      tech: {
        file: 'requirements/refund.sdoc:7',
        rels: ['allocated_to → 退款模块', 'constrained_by → ADR-PAY-003', 'verified_by → TEST-PAY-001'],
        rule: 'COV-001 / REL-002 通过'
      },
      tasks: [
        ['需求与验收资产', '补齐验收与关系（requirements/ · tests/）'],
        ['实现（退款模块）', '退款金额与订单状态一次事务内更新'],
        ['门禁、差异与证据', 'check / diff / impact，落 alm.evidence/v1']
      ]
    }
  ]

  const el = (id) => document.getElementById(id)
  const checkSvg = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.2 8.4 6.3 11.5 12.8 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'

  function card(req) {
    return `<article class="card" data-id="${req.id}" tabindex="0" role="button" aria-label="查看 ${req.title}">
      <div>
        <div class="card-head"><span class="pill ${req.state}">${req.stateText}</span><span class="id">${req.id}</span></div>
        <h2>${req.title}</h2>
        <p class="meta">${req.team}<span class="dot">·</span>验收 ${req.checks.length}/${req.checks.length}</p>
      </div>
      <button class="btn primary sm card-cta" data-start="${req.id}">开始开发</button>
    </article>`
  }

  let filter = 'all'
  let keyword = ''

  function render() {
    const visible = REQS.filter((r) => (filter === 'all' ? true : r.state === filter))
      .filter((r) => r.title.includes(keyword) || r.id.includes(keyword.toUpperCase()))
    el('list').innerHTML = visible.map(card).join('')
    el('empty').hidden = visible.length > 0
    el('summary').textContent = visible.length
      ? `${REQS.length} 条需求，验收齐全`
      : '没有匹配的需求'
    for (const btn of el('seg').querySelectorAll('button')) btn.classList.toggle('active', btn.dataset.filter === filter)
  }

  function openDrawer(id) {
    const req = REQS.find((r) => r.id === id)
    if (!req) return
    el('dPill').className = `pill ${req.state}`
    el('dPill').textContent = req.stateText
    el('dTitle').textContent = req.title
    el('dDesc').textContent = req.desc
    el('dChecks').innerHTML = req.checks.map((c) => `<div class="check">${checkSvg}<span>${c}</span></div>`).join('')
    el('dTech').innerHTML = `
      <div><code>${req.id}</code> · <code>${req.tech.file}</code></div>
      <div>关系：${req.tech.rels.join('；')}</div>
      <div>门禁：${req.tech.rule}</div>`
    el('dStart').dataset.start = req.id
    el('scrim').hidden = false
    el('drawer').hidden = false
    requestAnimationFrame(() => { el('scrim').classList.add('show'); el('drawer').classList.add('show') })
    el('drawer').scrollTop = 0
  }

  function closeDrawer() {
    el('scrim').classList.remove('show')
    el('drawer').classList.remove('show')
    setTimeout(() => { el('scrim').hidden = true; el('drawer').hidden = true }, 200)
  }

  function openModal(id) {
    const req = REQS.find((r) => r.id === id)
    if (!req) return
    el('modalLead').textContent = `将为「${req.title}」生成 ${req.tasks.length} 张任务卡。`
    el('modalTasks').innerHTML = req.tasks.map(([name, hint], i) =>
      `<div class="task-row"><div class="task-index">0${i + 1}</div><div><strong>${name}</strong><span>${hint}</span></div></div>`).join('')
    el('modal').hidden = false
  }

  function closeModal() { el('modal').hidden = true }

  document.addEventListener('click', (event) => {
    const start = event.target.closest('[data-start]')
    if (start) { event.stopPropagation(); openModal(start.dataset.start); return }
    const cardEl = event.target.closest('.card')
    if (cardEl) { openDrawer(cardEl.dataset.id); return }
  })

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') { closeModal(); closeDrawer() }
    if (event.key === 'Enter' && document.activeElement?.classList?.contains('card')) {
      openDrawer(document.activeElement.dataset.id)
    }
  })

  el('seg').addEventListener('click', (event) => {
    const btn = event.target.closest('button[data-filter]')
    if (!btn) return
    filter = btn.dataset.filter
    render()
  })
  el('search').addEventListener('input', (event) => { keyword = event.target.value.trim(); render() })
  el('scrim').addEventListener('click', closeDrawer)
  el('closeDrawer').addEventListener('click', closeDrawer)
  el('dStart').addEventListener('click', () => openModal(el('dStart').dataset.start))
  el('modalCancel').addEventListener('click', closeModal)
  el('modalConfirm').addEventListener('click', closeModal)
  el('newBtn').addEventListener('click', () => alert('原型：这里会打开「新建需求」引导'))
  render()
</script>
</body>
</html>

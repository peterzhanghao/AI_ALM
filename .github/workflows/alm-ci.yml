name: ALM MVP CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: alm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: alm-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit and contract tests
        run: pnpm test

      - name: CLI smoke
        run: |
          node packages/alm-core/bin/alm.mjs --help
          node packages/alm-core/bin/alm.mjs contract verify
